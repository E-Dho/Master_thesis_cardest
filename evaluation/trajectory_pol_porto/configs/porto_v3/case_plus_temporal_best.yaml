# P6: CASE+-Temporal (extension by us, spec "Temporal extension for CASE+ and
# TraHist") on Porto v3: CASE+ on the trajectories cut to the query's equi-depth
# time buckets (full CASE construction per trajectory span and restriction).
# unit_size_m and time_buckets are tuned on the validation workload
# (slurm/submit_p6.sh STAGE=tune) before the test runs.
# Tuned 2026-11-13 (select_tuned.py rule: min validation geometric-mean smoothed
# Q-error, validation multi only) under the Porto 1x budget = the Porto own
# model's inference-only size, 1,433,380,120 bytes (porto_traj_dedup_single_
# anchor_mbr_segments_first_20k, step 18750). Sweeps: traj_phase1_porto_v3_tuning_sparse{,_buckets_ext} (83f78e4, sparse storage).
# Pick without a size limit (best): 25 m / 3200 buckets (validation gm 1.43,
# p50 1.006, p90 3.94, p99 34.1, 4.62 GB = 3.2x the budget, within_budget false).
# Grid over the Porto window domain (adapter.grid_extent: window_domain, the
# 0.1 %/99.9 % endpoint box of porto_v3_config.json): GPS outliers up to
# 1,131 km away would stretch a data-extent grid to billions of cells; they
# fall into the border cells.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_porto_v3
  method_id: case_plus
  variant_id: temporal_best
  display_name: CASE+-Temporal, best without size limit (extended by us)
  protocol: adapted
  adaptation: Project-defined temporal extension of the CASE+ re-implementation - equi-depth time buckets (segments by time midpoint); a trajectory spanning buckets i..j gets the full CASE construction for each restriction to buckets lo..hi, counts kept per (i, j, lo, hi); a query over buckets a..b uses each span's restriction to a..b, i.e. CASE+ on the trajectories cut to the query buckets; Algorithm 2 and the CASE+ correction unchanged; only non-zero counts stored (virtual counts as MBR rectangles); trip-time predicates via segment times (approx); attribute predicates and single-table queries unsupported. With the full time range it reproduces CASE+ exactly.
  seeds: [0]
adapter:
  type: traj_case_plus
  benchmark_config: ../../../../query_generation/benchmark_v3/porto_v3_config.json
  plus: true
  temporal: true
  time_buckets: 3200
  unit_size_m: 25
  grid_extent: window_domain
  budget_bytes: 1433380120
