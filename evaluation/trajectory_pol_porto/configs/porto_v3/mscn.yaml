# P8b: MSCN on Porto v3, in process (geo-mlp: torch). Published architecture and
# training recipe; v3 predicate featurisation adapted (traj_eval/adapters/mscn.py).
# Trained on the Porto v3 training workload (10,000 queries, seed 20261104, test
# and validation excluded); the validation workload is reported, not used for
# selection.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_porto_v3
  method_id: mscn
  variant_id: trained_single_and_multi
  display_name: MSCN (trained on single + multi)
  protocol: adapted
  adaptation: Published MSCN architecture and training recipe (set convolution, 1,000 sample bitmaps per table, q-error loss, Adam 1e-3, 100 epochs, batch 1024, 256 hidden units); v3 predicates featurised as attribute one-hot + kind one-hot + nominal one-hot + six domain-normalised bounds with presence bits; bitmaps evaluated with the exact v3 semantics; one model for row-count and distinct-trip labels, trained on [single, multi] queries of a disjoint 10k v3 training workload.
  seeds: [0, 1, 2]
source:
  url: https://github.com/andreaskipf/learnedcardinalities.git
  installed_version: re-implemented in evaluation/trajectory_pol_porto/traj_eval/adapters/mscn.py (model and loss as mscn/model.py and train.py at 50073283)
timing:
  estimate_consistency:
    mode: deterministic
    relative_tolerance: 1.0e-4
    absolute_tolerance: 1.0
resources:
  profile: cpu_in_process_training
  cpu_threads: 8
adapter:
  type: traj_mscn
  benchmark_config: ../../../../query_generation/benchmark_v3/porto_v3_config.json
  training_jsonl: /work_beegfs/sunip956/master_thesis_trajectories/mobilitydb_porto/query_runs/qgen_porto_v3_training_seed20261104/benchmark.jsonl
  validation_jsonl: /work_beegfs/sunip956/master_thesis_trajectories/mobilitydb_porto/query_runs/qgen_porto_v3_validation_seed20261103/benchmark.jsonl
  training_relations: [single, multi]
  device: cpu
  recipe:
    sample_bits: 1000
    epochs: 100
    batch_size: 1024
    hidden_size: 256
    learning_rate: 0.001
