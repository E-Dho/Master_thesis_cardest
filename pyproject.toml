[project]
name = "master-thesis-cardest"
version = "0.1.0"
description = "Trajectory cardinality-estimation benchmark tooling for POL and MobilityDB."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
model = [
  "torch>=2.0",
]

[project.scripts]
joblight-eval = "evaluation.job_light_imdb_non_trajectory.joblight_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["query_generation", "model/tests", "evaluation/job_light_imdb_non_trajectory/tests"]
python_files = ["test_*.py"]
