dataset:
  type: pol_trajectory_full_join
  name: pol_traj_dedup_importance_rare_smoke
  prepared_directory: data/pol_prepared/pol_smoke
  sampling_mode: fixture
  sample_batch_size: 128
  trajectory_ids_path: data/pol_prepared/pol_smoke/sample_trajectory_ids.npy
  segment_ids_path: data/pol_prepared/pol_smoke/sample_segment_ids.npy
  trajectory_index_path: data/pol_prepared/pol_smoke/trajectory_segment_index
  num_workers: 0

schema:
  join_type: acyclic
  column_order: data_indicators_fanouts

model:
  type: predicate_resmade
  hidden_sizes: [64, 64]
  residual_connections: true
  direct_io_connections: true
  direct_io_source_kinds: [data, indicator, fanout]
  direct_io_destination_kinds: [data, indicator, fanout]
  activation: relu
  input_encoding: duet_binary
  output_encoding: embed
  output_embedding_size: 32
  output_embeddings_tied: false
  embedding_size: 16
  residual_dropout: 0.0
  fixed_ordering: true

factorization:
  enabled: true
  strategy: bitwise_lossless
  word_size_bits: 11
  minimum_domain_size: 2048
  factor_order: most_significant_first
  blacklist_columns: []
  blacklist_kinds: [indicator, fanout]

anpm:
  enabled: true
  previous_factor_embedding_size: 32
  hidden_size: 32
  teacher_force_during_training: true
  mask_invalid_combinations: true
  decode_chunk_size: 1024
  final_activation: relu
  materialize_original_distribution_for_debug: false

fanout:
  token: inv_fanout
  wildcard_token: wildcard
  compute_weights_in_log_space: true
  weight_normalization: batch_sum
  weight_clipping: null

predicate_generation:
  enabled: true
  strategy: duet_batch_bounds
  table_subset_sampling: neurocard_table_dropout_rooted
  enable_native_range_tokens: true
  normalize_predicate_probabilities: false
  wildcard_probability: 0.2
  equality_probability: 0.2
  lower_bound_probability: 0.2
  upper_bound_probability: 0.2
  native_range_probability: 0.2
  per_row_contexts: 1
  seed: 0
  trajectory_query_semantics: pol_segments
  trajectory_temporal_probability: 0.5
  trajectory_spatial_probability: 0.5
  trajectory_srid: 26916

predicate_encoding:
  mode: two_slot_binary_duet
  multi_predicate_merge: sum
  max_predicates_per_column: 2

importance_sampling:
  enabled: true
  mixture_probability: 0.2
  discovery:
    enabled: true
    root_data_only: true
    include_categorical_root_data: false
    max_candidate_domain_size: 128
    minimum_expected_context_support: 1
    max_selected_strata: 4
    support_planning_steps: 10
  allocation:
    strategy: support_deficit
  diagnostics:
    enabled: true
    global_rho_reservoir_size: 256
    per_stratum_rho_reservoir_size: 64

rare_support:
  enabled: true
  discovery:
    enabled: true
    root_data_only: true
    include_categorical_root_data: false
    max_candidate_domain_size: 128
    minimum_expected_context_support: 1
    max_selected_strata: 4
    support_planning_steps: 10
  allocation:
    strategy: support_deficit
  diagnostics:
    enabled: true

rare_auxiliary:
  enabled: true
  batch_size: 32
  beta: 0.25

trajectory_distinct:
  enabled: true
  head_name: traj_dedup_factor
  loss: mse
  loss_weight: 1.0
  output_activation: sigmoid
  anchor_samples_per_query: 1
  entity_table: trips
  segment_table: segments
  trajectory_key: trip_id
  segment_key: trip_id,segment_idx
  predicate_scope: segment_query
  srid: 26916
  trajectory_static_columns:
    - agents:age
    - agents:educationLevel
    - agents:interest
    - agents:joviality
    - agents:family_size
    - trips:num_of_segments
    - trips:start_time
    - trips:end_time
    - trips:trip_geom
  segment_varying_columns:
    - segments:segment_idx
    - segments:t_s
    - segments:t_e
    - segments:s_x
    - segments:s_y
    - segments:e_x
    - segments:e_y

training:
  seed: 0
  device: auto
  batch_size: 128
  learning_rate: 0.0001
  optimizer: adam
  epochs: 1
  steps_per_epoch: 2
  early_stopping_patience_steps: null
  gradient_clip_norm: 5.0
  checkpoint_interval_steps: 1
  validation_interval_steps: 1
  head_loss_reduction: sum
  mixed_precision: false

inference:
  progressive_sampling: false
  factorized_decoder: anpm
  use_log_space_product: true

validation:
  selection_metric: validation_traj_weighted_mse

logging:
  output_directory: model/runs/pol_traj_dedup_importance_rare_smoke
