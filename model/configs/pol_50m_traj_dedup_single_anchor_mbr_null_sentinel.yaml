dataset:
  type: pol_trajectory_full_join
  name: pol_50m_traj_dedup_single_anchor_mbr_null_sentinel
  prepared_directory: data/pol_prepared/pol_50m_mbr
  sampling_mode: fixture
  sample_batch_size: 2048
  trajectory_ids_path: data/pol_prepared/pol_50m_mbr/sample_trajectory_ids.npy
  segment_ids_path: data/pol_prepared/pol_50m_mbr/sample_segment_ids.npy
  trajectory_index_path: data/pol_prepared/pol_50m_mbr/trajectory_segment_index
  preload_trajectory_index: true
  num_workers: 0

trajectory_spatial:
  enabled: true
  representation: segment_mbr

schema:
  join_type: acyclic
  column_order: data_indicators_fanouts

model:
  type: predicate_resmade
  hidden_sizes: [512, 512, 512, 512]
  residual_connections: true
  direct_io_connections: true
  direct_io_source_kinds: [data, indicator, fanout]
  direct_io_destination_kinds: [data, indicator, fanout]
  activation: relu
  input_encoding: duet_binary
  output_encoding: embed
  output_embedding_size: 64
  output_embeddings_tied: false
  embedding_size: 32
  residual_dropout: 0.0
  fixed_ordering: true

factorization:
  enabled: true
  strategy: bitwise_lossless
  word_size_bits: 11
  minimum_domain_size: 2048
  factor_order: most_significant_first
  blacklist_columns: []
  blacklist_kinds: [indicator, fanout]

anpm:
  enabled: true
  previous_factor_embedding_size: 64
  hidden_size: 64
  teacher_force_during_training: true
  mask_invalid_combinations: true
  decode_chunk_size: 4096
  final_activation: relu
  materialize_original_distribution_for_debug: false

fanout:
  token: inv_fanout
  wildcard_token: wildcard
  compute_weights_in_log_space: true
  weight_normalization: batch_sum
  weight_clipping: null

predicate_generation:
  enabled: true
  strategy: duet_batch_bounds
  table_subset_sampling: neurocard_table_dropout_rooted
  enable_native_range_tokens: true
  normalize_predicate_probabilities: false
  wildcard_probability: 0.2
  equality_probability: 0.2
  lower_bound_probability: 0.2
  upper_bound_probability: 0.2
  native_range_probability: 0.2
  per_row_contexts: 1
  seed: 0
  trajectory_query_semantics: pol_segments
  trajectory_temporal_probability: 0.35
  trajectory_spatial_probability: 0.35
  trajectory_srid: 26916

predicate_encoding:
  mode: two_slot_binary_duet
  multi_predicate_merge: sum
  max_predicates_per_column: 2

importance_sampling:
  enabled: false

rare_support:
  enabled: true
  discovery:
    enabled: true
    root_data_only: true
    include_categorical_root_data: false
    max_candidate_domain_size: 4096
    minimum_expected_context_support: 100
    max_selected_strata: 64
    support_planning_steps: 20000
  allocation:
    strategy: support_deficit
  diagnostics:
    enabled: true

rare_auxiliary:
  enabled: true
  batch_size: 512
  beta: 0.25

trajectory_distinct:
  enabled: true
  head_name: traj_dedup_factor
  loss: mse
  loss_weight: 1.0
  output_activation: sigmoid
  anchor_samples_per_query: 1
  entity_table: trips
  segment_table: segments
  trajectory_key: trip_id
  segment_key: trip_id,segment_idx
  predicate_scope: segment_query
  srid: 26916
  trajectory_static_columns:
    - agents:age
    - agents:educationLevel
    - agents:interest
    - agents:joviality
    - agents:family_size
    - trips:num_of_segments
    - trips:start_time
    - trips:end_time
    - trips:trip_geom
  segment_varying_columns:
    - segments:segment_idx
    - segments:t_s
    - segments:t_e
    - segments:s_x
    - segments:s_y
    - segments:e_x
    - segments:e_y
    - segments:seg_min_x
    - segments:seg_max_x
    - segments:seg_min_y
    - segments:seg_max_y

# Null-token zero-cardinality training.
#
# Single-column impossibility is already exact at inference: the POL query
# adapter rewrites a literal no domain value satisfies into GREATER_THAN
# max(domain), whose mask is identically zero.  What this block targets is the
# remaining case -- conjunctions where every conjunct is individually
# satisfiable but nothing matches -- which is what the benchmark's 820
# true-zero queries actually are (they carry 2 to 7 predicates, and 558 of them
# draw their centres from live rows).
#
# The catalog scans the prepared fixture once and records which encoded value
# pairs ever co-occur.  A pair that never co-occurs, where both values clear
# min_marginal_count and the anchor keeps at least min_anchor_partners other
# partners, is a provable void: the void column's head is then supervised
# toward the sentinel and the sentinel cascades down the rest of the chain.
#
# min_anchor_partners is the guard that matters.  Without it an anchor value
# with few partners is void for nearly every alternative, and the head learns
# the cheaper rule "this anchor implies void" -- which then suppresses that
# anchor's genuine combinations too.
null_sentinel:
  enabled: true
  void_probability: 0.1
  chain_extension_probability: 0.2
  max_chain_extensions: 5
  max_catalog_domain_size: 512
  max_catalog_columns: 16
  min_marginal_count: 32
  min_anchor_partners: 4
  max_catalog_rows: null
  cascade: true

training:
  seed: 0
  device: auto
  batch_size: 2048
  learning_rate: 0.0001
  optimizer: adam
  epochs: 1
  steps_per_epoch: 20000
  early_stopping_patience_steps: 3000
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  checkpoint_interval_steps: 500
  validation_interval_steps: 250
  head_loss_reduction: sum
  mixed_precision: false

inference:
  progressive_sampling: false
  factorized_decoder: anpm
  use_log_space_product: true

validation:
  enabled: true
  prepared_directory: null
  interval_steps: 250
  fresh_sampler_batches: 4
  batch_size: 2048
  selection_metric: validation_traj_weighted_mse
  minimize: true

logging:
  output_directory: model/runs/pol_50m_traj_dedup_single_anchor_mbr_null_sentinel
  progress_interval_steps: 25
