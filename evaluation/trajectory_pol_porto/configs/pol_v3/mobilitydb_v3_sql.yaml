# P4: MobilityDB / PostgreSQL planner estimate, variant v3_sql. Deterministic:
# one seed. The adapter never runs ANALYZE (adapter.analyze: false) and
# records a fingerprint of pg_stats in database_identity.json, so all three
# variants are planned on the same statistics. Keep the three mobilitydb_*
# configs identical except for experiment.variant_id/display_name/adaptation
# and adapter.variant (the loader supports one level of extends only).
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_pol_v3
  method_id: mobilitydb
  variant_id: v3_sql
  display_name: MobilityDB/PostgreSQL planner (label SQL)
  adaptation: EXPLAIN row estimate of the benchmark's own label SQL (Liang-Barsky segment test); multi queries planned as GROUP BY trip_id, single queries as SELECT 1.
  protocol: adapted
  seeds: [0]
source:
  url: https://github.com/MobilityDB/MobilityDB.git
  installed_version: the cluster's mobilitydb environment; versions are recorded in database_identity.json
timing:
  comparison_basis: native_cpu_inference
  published_reference_hardware: CPU (PostgreSQL planner with PostGIS/MobilityDB selectivity functions)
  primary_profile: cpu_postgres_2core
  profiles: [cpu_postgres_2core]
  estimate_consistency:
    mode: deterministic
    relative_tolerance: 0.0
    absolute_tolerance: 0.0
resources:
  profile: cpu_primary
  cpu_threads: 1
adapter:
  type: traj_mobilitydb
  variant: v3_sql
  benchmark_config: ../../../../query_generation/benchmark_v3/pol_v3_config.json
  dsn: host=${MOBILITYDB_SOCKET_DIR} port=${MOBILITYDB_PORT} dbname=${MOBILITYDB_DB}
  analyze: false
  # The tgeompoint times equal the naive t_s/t_e read as UTC (probe
  # 2026-10-30, job 22578953: 0 or -1 us after UTC normalization; the server
  # default TimeZone is CET), so sessions run in UTC and the literals carry +00.
  session_timezone: UTC
  # MobilityDB 1.4.0 syntax (all three forms parse; probe 2026-10-30). The
  # spatial forms need the data SRID; prepare executes each template once.
  stbox:
    xt: stbox 'SRID={srid};STBOX XT((({xmin},{ymin}),({xmax},{ymax})),[{tmin}+00, {tmax}+00])'
    x: stbox 'SRID={srid};STBOX X(({xmin},{ymin}),({xmax},{ymax}))'
    t: stbox 'STBOX T([{tmin}+00, {tmax}+00])'
