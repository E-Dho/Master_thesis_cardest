dataset:
  type: synthetic_full_join
  name: synthetic_factorized_smoke
  csv_directory: datasets/example
  prepared_directory: data/neurocard_prepared/example
  sample_batch_size: 128
  num_workers: 0

schema:
  join_type: acyclic
  column_order: data_indicators_fanouts

model:
  type: predicate_resmade
  hidden_sizes: [64, 64]
  residual_connections: true
  direct_io_connections: false
  activation: relu
  input_encoding: embed
  output_encoding: one_hot
  embedding_size: 16
  residual_dropout: 0.0
  fixed_ordering: true

factorization:
  enabled: true
  strategy: bitwise_lossless
  word_size_bits: 1
  minimum_domain_size: 3
  factor_order: most_significant_first
  blacklist_columns: []
  blacklist_kinds: [indicator, fanout]

anpm:
  enabled: true
  previous_factor_embedding_size: 16
  hidden_size: 16
  teacher_force_during_training: true
  mask_invalid_combinations: true
  decode_chunk_size: 16
  materialize_original_distribution_for_debug: true

fanout:
  token: inv_fanout
  wildcard_token: wildcard
  compute_weights_in_log_space: true
  weight_normalization: batch_sum
  weight_clipping: null

predicate_generation:
  enabled: true
  wildcard_probability: 0.3
  table_subset_sampling: connected
  seed: 0

training:
  seed: 0
  device: auto
  batch_size: 32
  learning_rate: 0.0003
  optimizer: adam
  epochs: 1
  steps_per_epoch: 20
  gradient_clip_norm: 5.0
  checkpoint_interval_steps: 10
  validation_interval_steps: 10
  head_loss_reduction: mean
  mixed_precision: false

inference:
  progressive_sampling: false
  factorized_decoder: anpm
  use_log_space_product: true

logging:
  output_directory: model/runs/resmade_factorized_smoke
  tensorboard: false
