# P6: CASE+-Temporal (extension by us, spec "Temporal extension for CASE+ and
# TraHist") on POL v3: CASE+ on the trajectories cut to the query's equi-depth
# time buckets (full CASE construction per trajectory span and restriction).
# unit_size_m and time_buckets are tuned on the validation workload
# (slurm/submit_p6.sh STAGE=tune) before the test runs.
# Re-selected 2026-11-13 after the sparse CASE+ storage (83f78e4; identical
# estimates, other sizes): sweeps traj_phase1_pol_v3_tuning_sparse{,_buckets_ext},
# select_tuned.py rule (min validation geometric-mean smoothed Q-error), 1x budget
# = the own model's inference-only size, 872,606,460 bytes (pol_50m_..._
# segments_first_20k step 20000: 57.1 MB weights/buffers + 815.2 MB value domains).
# Budget pick: 50 m / 3200 buckets (validation gm 1.42, p90 3.49, p99 23.9,
# 463 MB; the dense pick was 200 m / 3200). Best without a size limit:
# case_plus_temporal_best.yaml.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_pol_v3
  method_id: case_plus
  variant_id: temporal
  display_name: CASE+-Temporal (extended by us)
  protocol: adapted
  adaptation: Project-defined temporal extension of the CASE+ re-implementation - equi-depth time buckets (segments by time midpoint); a trajectory spanning buckets i..j gets the full CASE construction for each restriction to buckets lo..hi, counts kept per (i, j, lo, hi); a query over buckets a..b uses each span's restriction to a..b, i.e. CASE+ on the trajectories cut to the query buckets; Algorithm 2 and the CASE+ correction unchanged; only non-zero counts stored (virtual counts as MBR rectangles); trip-time predicates via segment times (approx); attribute predicates and single-table queries unsupported. With the full time range it reproduces CASE+ exactly.
  seeds: [0]
adapter:
  type: traj_case_plus
  benchmark_config: ../../../../query_generation/benchmark_v3/pol_v3_config.json
  plus: true
  temporal: true
  time_buckets: 3200
  unit_size_m: 50
  budget_bytes: 872606460
