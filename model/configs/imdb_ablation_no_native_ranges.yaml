# Ablation (decided 2026-11-16). Identical to
# job_light_ranges_duet_binary_native_anpm_40k_rare_auxiliary.yaml except
# logging.output_directory (dataset.name stays: same data) and:
#   predicate_generation.enable_native_range_tokens: false and
#   native_range_probability: 0.0; its 0.2 share goes to the one-sided bounds
#   (lower 0.3, upper 0.3), as the generator itself does when native ranges are
#   off. Training sees no two-sided range on a column; JOB-light-ranges queries
#   still fill both slots at inference. Rare-support planning then plans no
#   range support (model/src/data/strata.py).
# Train with model/slurm/job_light_ranges_ablation_20k.sbatch, which applies the
# same 20k-step recipe as the evaluated model (job_light_ranges_rare_aux_20k).
dataset:
  type: neurocard_full_join
  name: job_light_ranges_duet_binary_native_anpm_40k_rare_auxiliary
  csv_directory: datasets/job
  prepared_directory: data/neurocard_prepared/job_light_ranges_content
  # NeuroCard calls its expanded JOB-light-ranges projection `content`;
  # its separate `full` mode is the JOB-full predicate-column projection.
  use_cols: content
  sampling_mode: live
  sampler_batch_size: 16384
  sample_batch_size: 2048
  sampler_seed: 0
  neurocard_path: /work_beegfs/sunip956/master_thesis_trajectories/external/neurocard/neurocard
  num_workers: 0

schema:
  join_type: acyclic
  column_order: data_indicators_fanouts

model:
  type: predicate_resmade
  hidden_sizes: [512, 512, 512, 512]
  residual_connections: true
  direct_io_connections: true
  direct_io_source_kinds: [data, indicator, fanout]
  direct_io_destination_kinds: [data, indicator, fanout]
  activation: relu
  input_encoding: duet_binary
  output_encoding: embed
  output_embedding_size: 64
  output_embeddings_tied: false
  embedding_size: 32
  residual_dropout: 0.0
  fixed_ordering: true

factorization:
  enabled: true
  strategy: bitwise_lossless
  word_size_bits: 11
  minimum_domain_size: 2048
  factor_order: most_significant_first
  blacklist_columns: []
  blacklist_kinds: [indicator, fanout]

anpm:
  enabled: true
  previous_factor_embedding_size: 64
  hidden_size: 64
  teacher_force_during_training: true
  mask_invalid_combinations: true
  decode_chunk_size: 4096
  final_activation: relu
  materialize_original_distribution_for_debug: false

fanout:
  token: inv_fanout
  wildcard_token: wildcard
  compute_weights_in_log_space: true
  weight_normalization: batch_sum
  weight_clipping: null

predicate_generation:
  enabled: true
  strategy: duet_batch_bounds
  table_subset_sampling: neurocard_table_dropout_rooted
  enable_native_range_tokens: false
  normalize_predicate_probabilities: false
  wildcard_probability: 0.2
  equality_probability: 0.2
  lower_bound_probability: 0.3
  upper_bound_probability: 0.3
  native_range_probability: 0.0
  per_row_contexts: 1
  seed: 0

predicate_encoding:
  mode: two_slot_binary_duet
  multi_predicate_merge: sum
  max_predicates_per_column: 2

importance_sampling:
  enabled: false

rare_support:
  enabled: true
  discovery:
    enabled: true
    root_data_only: true
    include_categorical_root_data: false
    max_candidate_domain_size: 4096
    minimum_expected_context_support: 100
    max_selected_strata: 64
    support_planning_steps: 40000
    root_column_semantics:
      title:
        production_year: ordered
        kind_id: categorical
  allocation:
    strategy: support_deficit
  diagnostics:
    enabled: true

rare_auxiliary:
  enabled: true
  batch_size: 512
  beta: 0.25

training:
  seed: 0
  device: auto
  # Steps prepared ahead in 3 forked processes (sampler process + workers); same
  # training as without them (model/tests/test_training_prefetch.py).
  prefetch_workers: 3
  batch_size: 2048
  learning_rate: 0.0001
  optimizer: adam
  epochs: 1
  steps_per_epoch: 40000
  early_stopping_patience_steps: 5000
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  checkpoint_interval_steps: 500
  validation_interval_steps: 250
  head_loss_reduction: sum
  mixed_precision: false

inference:
  progressive_sampling: false
  factorized_decoder: anpm
  use_log_space_product: true

logging:
  output_directory: model/runs/imdb_ablation_no_native_ranges

# Interpreter and device (model.src.runtime_interpreter): the learned-gpu environment
# (PyTorch 2.5.1 + CUDA 12.1) that trained the evaluated models; no CPU fallback.
runtime:
  python: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python
  require_cuda: true
