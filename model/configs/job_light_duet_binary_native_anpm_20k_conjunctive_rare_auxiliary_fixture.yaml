# Conjunctive rare-support strata on JOB-light, in fixture mode.
#
# This is the only JOB-light configuration that can exercise conjunctive
# discovery at all.  Live NeuroCard sampling imposes a stratum by filtering the
# root join-count table one column at a time, so it cannot condition on a
# conjunction spanning non-root tables and reports the capability as absent;
# discovery then falls back to depth-1 and records the reason.  Fixture mode
# samples from materialized rows, where a conjunction is an AND over row masks,
# so the whole path -- exact joint counts, joint realization mass, conditional
# sampling -- is available.
#
# It is therefore NOT a like-for-like rerun of the live 20k run.  Fixture mode
# trains on a fixed materialized sample instead of fresh draws from the join,
# so q-errors from this config answer "does the feature work end to end", not
# "does the feature help".  Comparing against the live run would confound the
# sampling mode with the feature.
#
# REQUIRES A REGENERATED FIXTURE.  prepare_neurocard_data writes sample_rows.npy
# at dataset.sample_batch_size rows (512 by default) and returns early when a
# manifest already exists, so the prepared JOB-light directory holds 512 rows
# against a 2.1e12-row join.  That cannot estimate rare joint support at all:
# a region covering a millionth of the join is expected in 0.0005 of those rows.
# minimum_materialized_rows below makes the run refuse to start until the
# fixture is rebuilt:
#
#   python3 -m model.scripts.prepare_neurocard_data \
#     --config model/configs/job_light_duet_binary_native_anpm_20k_conjunctive_rare_auxiliary_fixture.yaml \
#     --rebuild-domains --sample-rows 2000000
#
# At 19 int64 columns that is roughly 300 MB on disk.  csv_directory and
# neurocard_path are present because --rebuild-domains reads them; it writes to
# its own prepared_directory rather than the shared data/neurocard_prepared/
# job_light, so rebuilding this fixture cannot disturb the live configs that
# read the shared one.
dataset:
  type: neurocard_full_join
  name: job_light_duet_binary_native_anpm_20k_conjunctive_rare_auxiliary_fixture
  prepared_directory: data/neurocard_prepared/job_light_conjunctive_2m
  csv_directory: datasets/job
  neurocard_path: /work_beegfs/sunip956/master_thesis_trajectories/external/neurocard/neurocard
  sampling_mode: fixture
  sample_batch_size: 2048
  num_workers: 0

schema:
  join_type: acyclic
  column_order: data_indicators_fanouts

model:
  type: predicate_resmade
  hidden_sizes: [512, 512, 512, 512]
  residual_connections: true
  direct_io_connections: true
  direct_io_source_kinds: [data, indicator, fanout]
  direct_io_destination_kinds: [data, indicator, fanout]
  activation: relu
  input_encoding: duet_binary
  output_encoding: embed
  output_embedding_size: 64
  output_embeddings_tied: false
  embedding_size: 32
  residual_dropout: 0.0
  fixed_ordering: true

factorization:
  enabled: true
  strategy: bitwise_lossless
  word_size_bits: 11
  minimum_domain_size: 2048
  factor_order: most_significant_first
  blacklist_columns: []
  blacklist_kinds: [indicator, fanout]

anpm:
  enabled: true
  previous_factor_embedding_size: 64
  hidden_size: 64
  teacher_force_during_training: true
  mask_invalid_combinations: true
  decode_chunk_size: 4096
  final_activation: relu
  materialize_original_distribution_for_debug: false

fanout:
  token: inv_fanout
  wildcard_token: wildcard
  compute_weights_in_log_space: true
  weight_normalization: batch_sum
  weight_clipping: null

predicate_generation:
  enabled: true
  strategy: duet_batch_bounds
  table_subset_sampling: neurocard_table_dropout_rooted
  enable_native_range_tokens: true
  normalize_predicate_probabilities: false
  wildcard_probability: 0.2
  equality_probability: 0.2
  lower_bound_probability: 0.2
  upper_bound_probability: 0.2
  native_range_probability: 0.2
  per_row_contexts: 1
  seed: 0

predicate_encoding:
  mode: two_slot_binary_duet
  multi_predicate_merge: sum
  max_predicates_per_column: 2

importance_sampling:
  enabled: false

rare_support:
  enabled: true
  discovery:
    enabled: true
    root_data_only: true
    # Root columns default to "categorical" when root_column_semantics does not
    # name them, and false here skipped every one of those, so on the live path
    # title:production_year was the only seed column that ever existed.
    include_categorical_root_data: true
    # Model columns are table:column.  The dotted table.column spelling is the
    # NeuroCard root join-count dataframe's, and matches no model column.
    # The tail this feature targets lives on movie_keyword:keyword_id, whose
    # domain is ~134k, and movie_companies:company_id at ~235k.  A 4096 cap
    # excludes exactly the columns the search needs, so the pool is restricted
    # by name instead: that keeps key columns such as title:id out without
    # also excluding the high-cardinality columns that matter.
    #
    # A categorical column yields one equality region per OBSERVED value, and
    # at 2M rows essentially every one of the ~134k keyword ids is observed, so
    # this really is ~134k candidates per such column.  max_candidates_per_column
    # keeps the rarest ones, which are the only ones with a deficit to repair.
    max_candidate_domain_size: 262144
    max_candidates_per_column: 4096
    candidate_column_names:
      - title:production_year
      - title:kind_id
      # Enriched 9.5x, 7.4x and 8.3x respectively in the worst 20 queries.
      # Omitting them is why every selected stratum paired production_year with
      # something: on the live path include_categorical_root_data=false left
      # production_year as the only seed column in existence, and here this
      # allowlist left out the columns that actually carry the tail.
      - title:season_nr
      - title:episode_nr
      - title:series_years
      - title:phonetic_code
      - movie_keyword:keyword_id
      - movie_companies:company_id
      - movie_info:info_type_id
      - movie_info_idx:info_type_id
      - cast_info:role_id
      - cast_info:nr_order
    minimum_expected_context_support: 100
    deficit_objective: log_ratio
    # A rare region still has to hold enough distinct rows that oversampling it
    # teaches the shape of the region rather than the identity of its rows.
    # minimum_joint_rows guards only conjunctions; this guards every depth.
    # Sizing: the auxiliary stream draws 512 x 20,000 = 10.24M rows, so 64
    # evenly weighted strata take ~160,000 draws each, while the main stream
    # shows a typical fixture row 2048 x 20,000 / 2e6 = 20.5 times.  A floor of
    # 1000 rows holds a stratum's per-row exposure to ~160, under 8x the main
    # stream.  Without it, log_ratio ranks a one-row region top and 53 of 64
    # selected strata covered a single row apiece -- 160,000 draws of one row.
    # Raising it further is safe (the run refuses rather than degrades); the
    # audit must report row_floor_applied: true and at_or_below_one: 0.
    minimum_stratum_rows: 1000
    max_selected_strata: 64
    support_planning_steps: 20000
    root_column_semantics:
      title:
        production_year: ordered
        kind_id: categorical
        # The tail-attribution analysis puts these three 7-9x above their base
        # rate in the worst 20 queries of the 1000-query ranges workload, with
        # group medians four to six orders of magnitude worse than anything
        # else.  They are numeric with nulls, and _ordered_numeric_values skips
        # structural values, so "ordered" holds and gives tail regions as well
        # as equality -- which is what a range workload needs.
        season_nr: ordered
        episode_nr: ordered
        series_years: ordered
        phonetic_code: categorical
    conjunctive:
      enabled: true
      max_depth: 2
      beam_width: 64
      seed_width: 64
      extension_width: 64
      # Extensions are ranked by how rare a value is GIVEN a seed, not by how
      # rare it is overall.  A keyword common across the corpus but almost
      # absent in the latest production years is exactly the dependence this
      # experiment is about, and marginal ranking prunes it before the beam
      # sees it.  One bincount per (seed, column) gives the joint count for
      # every value of that column at once, so this costs a pass, not a pass
      # per candidate.
      conditional_extension_width: 8
      # 100 of >= 2e6 rows is 0.005% of the fixture, so a region can still be
      # rare and clear the floor.  Against the default 512-row fixture the same
      # 100 would have demanded that a "rare" conjunction cover a fifth of the
      # sample; max_joint_row_fraction refuses that arithmetic rather than
      # letting it through.
      minimum_joint_rows: 100
      max_joint_row_fraction: 0.01
      minimum_materialized_rows: 2000000
      require_distinct_tables: true
      max_stratum_share: 0.1
      # Fail the run rather than fall back silently: the point of this config is
      # to exercise conjunctions, so discovering none is a failed experiment,
      # and the keyword column has to be in the pool for that to be possible.
      # movie_keyword:keyword_id is no longer required.  Tail attribution puts
      # it at 0.70x its base rate in the worst 20 queries -- it is DEPLETED in
      # the tail, not enriched -- so demanding a conjunction on it was aiming
      # at the wrong column.  require_conjunctions stays on so a run that forms
      # no conjunction at all still fails loudly instead of going depth-1 in
      # silence.
      require_conjunctions: true
  allocation:
    strategy: support_deficit
  diagnostics:
    enabled: true

rare_auxiliary:
  enabled: true
  batch_size: 512
  beta: 0.25

training:
  seed: 0
  device: auto
  batch_size: 2048
  learning_rate: 0.0001
  optimizer: adam
  epochs: 1
  steps_per_epoch: 20000
  early_stopping_patience_steps: 3000
  early_stopping_monitor: validation
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  checkpoint_interval_steps: 500
  validation_interval_steps: 250
  head_loss_reduction: sum
  mixed_precision: false

inference:
  progressive_sampling: false
  factorized_decoder: anpm
  use_log_space_product: true

validation:
  enabled: true
  interval_steps: 250
  fresh_sampler_batches: 10
  batch_size: 2048
  selection_metric: validation_weighted_nll
  minimize: true
  # Left null, this resamples the SAME fixture with a different seed, which is
  # a lower-variance signal than a single training batch but is not held out:
  # in fixture mode the row set is finite and shared with training.  Point this
  # at a separately prepared JOB-light fixture to get held_out_fixture mode.
  prepared_directory: null
  # Note: validation_weighted_nll is a mean-likelihood metric and the uniform
  # term dominates the loss, so it tracks median behaviour far better than the
  # tail this feature targets.  Checkpoint selection by tail q-error needs a
  # tail-aware selection metric, which does not exist yet.

logging:
  output_directory: model/runs/job_light_duet_binary_native_anpm_20k_conjunctive_rare_auxiliary_fixture
