# P6: TraHist (Jo et al., PACMMOD 2026) on Porto v3, spatial only. Upstream code
# (YJ960/TraHist, pinned below) runs from its checkout; see
# traj_eval/adapters/trahist.py. unit_size_m and time_buckets are tuned on the
# validation workload (slurm/submit_p6.sh STAGE=tune) before the test runs.
# Tuned 2026-11-13 (select_tuned.py rule: min validation geometric-mean smoothed
# Q-error, validation multi only) under the Porto 1x budget = the Porto own
# model's inference-only size, 1,433,380,120 bytes (porto_traj_dedup_single_
# anchor_mbr_segments_first_20k, step 18750). Sweeps: traj_phase1_porto_v3_tuning (535e063).
# Pick: 50 m (validation gm 2.72, p50 2.15, p90 8.82, p99 68.0, 100 MB); budget
# = best (25 m: gm 2.99).
# Grid over the Porto window domain (adapter.grid_extent: window_domain, the
# 0.1 %/99.9 % endpoint box of porto_v3_config.json): GPS outliers up to
# 1,131 km away would stretch a data-extent grid to billions of cells; they
# fall into the border cells.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_porto_v3
  method_id: trahist
  variant_id: base
  display_name: TraHist (spatial only)
  protocol: adapted
  adaptation: Upstream TraHist (YJ960/TraHist 870e8ce, unchanged construction and estimator) on the trip polyline vertices; query rectangles clipped to the grid extent before upstream's cell-resolution sampling; spatial only, so queries with a time predicate, attribute predicates and single-table queries are unsupported.
  seeds: [0]
adapter:
  type: traj_trahist
  benchmark_config: ../../../../query_generation/benchmark_v3/porto_v3_config.json
  trahist_source: /work_beegfs/sunip956/master_thesis_trajectories/external/trahist
  trahist_revision: 870e8ce6db0e6363eeca80dce193623034c858ab
  temporal: false
  unit_size_m: 50
  alpha: 0.5
  beta: 1.0
  kappa: 3
  connectivity: axis
  agg_mode: mean
  ratio_eps: 1.0
  grid_extent: window_domain
  budget_bytes: 1433380120
