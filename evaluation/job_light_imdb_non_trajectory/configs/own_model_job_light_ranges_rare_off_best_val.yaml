# JOB-light-ranges main row: checkpoint_best.pt (lowest validation loss over 20,000 steps, the rule of
# the POL/Porto mains since 2026-11-26), training seeds 0-2, rare support off.
# Same workload, bridge, inference code (7c156b2) and timing settings as
# own_model_job_light_ranges_full_schema_step_11000.yaml; only the trained runs differ: model/slurm/job_light_main_rare_off.sbatch
# (model/imdb-ablations a059a4d; rare support and its auxiliary batch off, decided 2026-11-25).
extends: own_model_job_light_ranges_full_schema_step_11000.yaml

experiment:
  variant_id: rare_off_content_best_val
  display_name: Own model best validation checkpoint (rare support off)
artifacts:
  checkpoint_template: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt
  training_config_template: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml
adapter:
  prepare_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python evaluation/job_light_imdb_non_trajectory/scripts/own_model_bridge.py prepare --config /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml --checkpoint /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt --output-directory {exchange_directory}
  smoke_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python evaluation/job_light_imdb_non_trajectory/scripts/own_model_bridge.py smoke --config /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml --checkpoint /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt --output-directory {exchange_directory} --queries /work_beegfs/sunip956/master_thesis_trajectories/external/distjoin/queries/job-light-ranges.csv --query-limit {query_limit} --warmup-passes 0 --repetitions 1 --device cpu
  build_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python evaluation/job_light_imdb_non_trajectory/scripts/own_model_bridge.py build --config /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml --checkpoint /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt --output-directory {exchange_directory}
  evaluate_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python evaluation/job_light_imdb_non_trajectory/scripts/own_model_bridge.py evaluate --config /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml --checkpoint /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt --output-directory {exchange_directory} --queries {queries_csv} --predictions {predictions_csv} --latencies {latency_csv} --warmup-passes 1 --repetitions 10 --device cuda
  timing_commands:
    cpu_1core: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python evaluation/job_light_imdb_non_trajectory/scripts/own_model_bridge.py evaluate --config /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml --checkpoint /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt --output-directory {exchange_directory} --queries {queries_csv} --predictions {predictions_csv} --latencies {latency_csv} --warmup-passes 1 --repetitions 10 --device cpu
    gpu_single_query: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python evaluation/job_light_imdb_non_trajectory/scripts/own_model_bridge.py evaluate --config /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/training_config.yaml --checkpoint /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/own_model_job_light_ranges_rare_off_20k/seed_{seed}/checkpoint_best.pt --output-directory {exchange_directory} --queries {queries_csv} --predictions {predictions_csv} --latencies {latency_csv} --warmup-passes 1 --repetitions 10 --device cuda
