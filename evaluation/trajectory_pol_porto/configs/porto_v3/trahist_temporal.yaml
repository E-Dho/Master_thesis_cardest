# P6: TraHist-Temporal (extension by us, spec "Temporal extension for CASE+ and
# TraHist") on Porto v3: TraHist's grid and LabelMap plus per-bucket point counts
# and F/L distinct statistics over equi-depth time buckets (segments by time
# midpoint). unit_size_m and time_buckets are tuned on the validation workload
# (slurm/submit_p6.sh STAGE=tune) before the test runs.
# Tuned 2026-11-13 (select_tuned.py rule: min validation geometric-mean smoothed
# Q-error, validation multi only) under the Porto 1x budget = the Porto own
# model's inference-only size, 1,433,380,120 bytes (porto_traj_dedup_single_
# anchor_mbr_segments_first_20k, step 18750). Sweeps: traj_phase1_porto_v3_tuning{,_buckets_ext} (535e063).
# Pick: 50 m / 3200 buckets (validation gm 2.39, p50 1.77, p90 7.62, p99 42.0,
# 292 MB); budget = best.
# Grid over the Porto window domain (adapter.grid_extent: window_domain, the
# 0.1 %/99.9 % endpoint box of porto_v3_config.json): GPS outliers up to
# 1,131 km away would stretch a data-extent grid to billions of cells; they
# fall into the border cells.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_porto_v3
  method_id: trahist
  variant_id: temporal
  display_name: TraHist-Temporal (extended by us)
  protocol: adapted
  adaptation: Project-defined temporal extension of upstream TraHist (YJ960/TraHist 870e8ce) - per spatial bucket, point counts and the sum of its cells' distinct-trajectory statistics F/L per equi-depth time bucket (D = sum F - sum L, exact per cell over bucket-aligned intervals), plugged into TraHist's own ratio estimator; all time buckets intersecting the query interval; trip-time predicates answered with the point times (approx); attribute predicates and single-table queries unsupported. With the full time range it reproduces TraHist exactly.
  seeds: [0]
adapter:
  type: traj_trahist
  benchmark_config: ../../../../query_generation/benchmark_v3/porto_v3_config.json
  trahist_source: /work_beegfs/sunip956/master_thesis_trajectories/external/trahist
  trahist_revision: 870e8ce6db0e6363eeca80dce193623034c858ab
  temporal: true
  time_buckets: 3200
  unit_size_m: 50
  alpha: 0.5
  beta: 1.0
  kappa: 3
  connectivity: axis
  agg_mode: mean
  ratio_eps: 1.0
  grid_extent: window_domain
  budget_bytes: 1433380120
