# P6: CASE+-Temporal (extension by us, spec "Temporal extension for CASE+ and
# TraHist") on POL v3: CASE+'s grid and counts with per-time-bucket real
# counts (F/L distinct statistics) and virtual counts per trajectory time span.
# unit_size_m and time_buckets are tuned on the validation workload
# (slurm/submit_p6.sh STAGE=tune) before the test runs.
# Tuned 2026-11-06 (traj_eval/select_tuned.py at 2d3a923, validation multi only):
# min geometric-mean smoothed Q-error under the 1x budget = the own model's
# inference-only size, 872,606,460 bytes (pol_50m_..._segments_first_20k step
# 20000: 57.1 MB weights/buffers + 815.2 MB value domains needed at inference).
# Pick without a size limit (best): 100 m / 3200 buckets (validation gm 1.48,
# p90 4.06, p99 28.2, 1.17 GB = 1.34x the budget, within_budget false).
# The budget pick is case_plus_temporal.yaml.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_pol_v3
  method_id: case_plus
  variant_id: temporal_best
  display_name: CASE+-Temporal, best without size limit (extended by us)
  protocol: adapted
  adaptation: Project-defined temporal extension of the CASE+ re-implementation - real face/edge counts per equi-depth time bucket with links between consecutive occupied buckets (exact distinct counts per cell/edge over bucket-aligned intervals); a planarized trajectory's virtual counts apply when the query buckets contain its whole time span; Algorithm 2 and the CASE+ correction unchanged; trip-time predicates via segment times (approx); attribute predicates and single-table queries unsupported. With the full time range it reproduces CASE+ exactly.
  seeds: [0]
adapter:
  type: traj_case_plus
  benchmark_config: ../../../../query_generation/benchmark_v3/pol_v3_config.json
  plus: true
  temporal: true
  time_buckets: 3200
  unit_size_m: 100
  budget_bytes: 872606460
