schema_version: 1
experiment:
  experiment_id: joblight_phase1
  method_id: deepdb
  variant_id: imdb_light_ranges_adapted
  display_name: DeepDB JOB-light-ranges adapted
  protocol: adapted
  adaptation: Project-owned extension of the native imdb-light schema that models title.imdb_index, title.phonetic_code, title.season_nr, title.episode_nr, title.series_years, and cast_info.nr_order; the three string columns are PostgreSQL-collation ranks. Separate preprocessing and a newly trained SPN ensemble; not the published DeepDB configuration.
  seeds: [0, 1, 2]
source:
  url: https://github.com/DataManagementLab/deepdb-public.git
  revision: 655ada13a043a4226a239b0c0a65bcdefef87a02
  checkout_path: /work_beegfs/sunip956/master_thesis_trajectories/external/deepdb
paths:
  results_root: ../results
workloads:
  job_light_ranges:
    queries_csv: /work_beegfs/sunip956/master_thesis_trajectories/external/distjoin/queries/job-light-ranges.csv
    expected_query_count: 1000
timing:
  device: cpu
  warmup_passes: 1
  repetitions: 10
  sequential_single_query: true
  includes_predicate_encoding: true
  includes_workload_parsing: false
  includes_rank_literal_rewrite: true
resources:
  profile: cpu_build_cpu_inference
  cpu_threads: 4
artifacts:
  dataset_root: /work_beegfs/sunip956/master_thesis_trajectories/datasets/job
  dataset_manifest: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/imdb_dataset_manifest.json
  adapted_shared_root: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/deepdb_ranges_adapted_shared
adapter:
  type: deepdb
  working_directory: ../../..
  environment:
    PYTHONPATH: null
  require_smoke_before_build: true
  recipe:
    schema: imdb_light_ranges_adapted
    added_modeled_columns: [title.imdb_index, title.phonetic_code, title.season_nr, title.episode_nr, title.series_years, cast_info.nr_order]
    ranked_string_columns: [title.imdb_index, title.phonetic_code, title.series_years]
    string_encoding: postgresql_collation_dense_rank
    sample_sizes: [10000000, 10000000, 1000000, 1000000, 1000000]
    budget_factor: 5
    max_tables_per_ensemble: 3
  prepare_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/deepdb/bin/python evaluation/job_light_imdb_non_trajectory/scripts/deepdb_ranges_adapted_bridge.py prepare --source-root /work_beegfs/sunip956/master_thesis_trajectories/external/deepdb --revision 655ada13a043a4226a239b0c0a65bcdefef87a02 --dataset-root /work_beegfs/sunip956/master_thesis_trajectories/datasets/job --shared-root /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/deepdb_ranges_adapted_shared --output-directory {exchange_directory}
  smoke_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/deepdb/bin/python evaluation/job_light_imdb_non_trajectory/scripts/deepdb_ranges_adapted_bridge.py smoke --source-root /work_beegfs/sunip956/master_thesis_trajectories/external/deepdb --revision 655ada13a043a4226a239b0c0a65bcdefef87a02 --shared-root /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/deepdb_ranges_adapted_shared --queries /work_beegfs/sunip956/master_thesis_trajectories/external/distjoin/queries/job-light-ranges.csv --output-directory {exchange_directory}/deepdb_smoke
  build_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/deepdb/bin/python evaluation/job_light_imdb_non_trajectory/scripts/deepdb_ranges_adapted_bridge.py build --source-root /work_beegfs/sunip956/master_thesis_trajectories/external/deepdb --revision 655ada13a043a4226a239b0c0a65bcdefef87a02 --dataset-root /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/deepdb_ranges_adapted_shared --output-directory {exchange_directory} --database imdb_joblight --pg-host /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/socket --pg-port 55432 --seed {seed}
  evaluate_command: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/deepdb/bin/python evaluation/job_light_imdb_non_trajectory/scripts/deepdb_ranges_adapted_bridge.py evaluate --source-root /work_beegfs/sunip956/master_thesis_trajectories/external/deepdb --revision 655ada13a043a4226a239b0c0a65bcdefef87a02 --shared-root /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/deepdb_ranges_adapted_shared --checkpoint {exchange_directory}/ensemble/ensemble_join_3_budget_5_10000000.pkl --queries {queries_csv} --predictions {predictions_csv} --latency {latency_csv}
