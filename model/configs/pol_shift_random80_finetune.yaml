# Data-shift ablation (decided 2026-11-17), POL, random80: update by fine-tuning.
# The stale model (pol_shift_random80_stale, checkpoint_best) trained further on the full
# data (pol_50m_traj_dedup_single_anchor_mbr_segments_first_20k.yaml's preparation): training.init_checkpoint, 2,000 steps (10 % of the
# training) at a tenth of the learning rate (1e-5), rare-support planning over those steps.
# Everything else as the evaluated model. The stale run must have finished first.
# Since 2026-11-25 also with predicate_generation.log_width_gate; the retrain
# reference is pol_main_log_width_gate_seed0.yaml (model/pol-ablations), trained with the same gate.
# Rare support off (decided 2026-11-25): rare_support.enabled and rare_auxiliary.enabled are
# false for all own-model trainings; the earlier models trained with them on.
dataset:
  type: pol_trajectory_full_join
  name: pol_shift_random80_finetune
  prepared_directory: /work_beegfs/sunip956/master_thesis_trajectories/Master_thesis_cardest/data/pol_prepared/pol_50m_mbr
  sampling_mode: fixture
  sample_batch_size: 2048
  trajectory_ids_path: /work_beegfs/sunip956/master_thesis_trajectories/Master_thesis_cardest/data/pol_prepared/pol_50m_mbr/sample_trajectory_ids.npy
  segment_ids_path: /work_beegfs/sunip956/master_thesis_trajectories/Master_thesis_cardest/data/pol_prepared/pol_50m_mbr/sample_segment_ids.npy
  trajectory_index_path: /work_beegfs/sunip956/master_thesis_trajectories/Master_thesis_cardest/data/pol_prepared/pol_50m_mbr/trajectory_segment_index
  preload_trajectory_index: true
  num_workers: 0

trajectory_spatial:
  enabled: true
  representation: segment_mbr

schema:
  join_type: acyclic
  column_order: data_indicators_fanouts
  table_order: [segments, trips, agents]

model:
  type: predicate_resmade
  hidden_sizes: [512, 512, 512, 512]
  residual_connections: true
  direct_io_connections: true
  direct_io_source_kinds: [data, indicator, fanout]
  direct_io_destination_kinds: [data, indicator, fanout]
  activation: relu
  input_encoding: duet_binary
  output_encoding: embed
  output_embedding_size: 64
  output_embeddings_tied: false
  embedding_size: 32
  residual_dropout: 0.0
  fixed_ordering: true

factorization:
  enabled: true
  strategy: bitwise_lossless
  word_size_bits: 11
  minimum_domain_size: 2048
  factor_order: most_significant_first
  blacklist_columns: []
  blacklist_kinds: [indicator, fanout]

anpm:
  enabled: true
  previous_factor_embedding_size: 64
  hidden_size: 64
  teacher_force_during_training: true
  mask_invalid_combinations: true
  decode_chunk_size: 4096
  final_activation: relu
  materialize_original_distribution_for_debug: false

fanout:
  token: inv_fanout
  wildcard_token: wildcard
  compute_weights_in_log_space: true
  weight_normalization: batch_sum
  weight_clipping: null

predicate_generation:
  enabled: true
  strategy: duet_batch_bounds
  table_subset_sampling: neurocard_table_dropout_rooted
  enable_native_range_tokens: true
  normalize_predicate_probabilities: false
  wildcard_probability: 0.2
  equality_probability: 0.2
  lower_bound_probability: 0.2
  upper_bound_probability: 0.2
  native_range_probability: 0.2
  per_row_contexts: 1
  seed: 0
  trajectory_query_semantics: pol_segments
  trajectory_temporal_probability: 0.35
  trajectory_spatial_probability: 0.35
  trajectory_srid: 26916
  # Log-width gate (model.src.predicates.generation, 2026-11-25): per context and
  # dimension, with probability 0.5 the bounds on the time / coordinate columns lie
  # at a log-uniform distance from the row's own value (min_width up to the
  # column's domain span) instead of uniformly over the domain ranks. 0.5 mixes
  # the two; the minimum widths are the data's resolution (1 s, 1 m), not taken
  # from the benchmark. probability 0 is the generator of the earlier models.
  log_width_gate:
    probability: 0.5
    # Distances are drawn up to the range between the 1 % and 99 % quantiles of each
    # column's domain values (robust to outliers, e.g. Porto's far GPS points).
    span_quantile: 0.01
    dimensions:
      space:
        min_width: 1.0
        columns:
          - segments:s_x
          - segments:s_y
          - segments:e_x
          - segments:e_y
          - segments:seg_min_x
          - segments:seg_max_x
          - segments:seg_min_y
          - segments:seg_max_y
      time:
        min_width: 1.0
        columns:
          - trips:start_time
          - trips:end_time
          - segments:t_s
          - segments:t_e

predicate_encoding:
  mode: two_slot_binary_duet
  multi_predicate_merge: sum
  max_predicates_per_column: 2

importance_sampling:
  enabled: false

rare_support:
  enabled: false
  discovery:
    enabled: true
    root_data_only: true
    include_categorical_root_data: false
    max_candidate_domain_size: 4096
    minimum_expected_context_support: 100
    max_selected_strata: 64
    support_planning_steps: 2000
  allocation:
    strategy: support_deficit
  diagnostics:
    enabled: true

rare_auxiliary:
  enabled: false
  batch_size: 512
  beta: 0.25

trajectory_distinct:
  enabled: true
  head_name: traj_dedup_factor
  loss: mse
  loss_weight: 1.0
  output_activation: sigmoid
  anchor_samples_per_query: 1
  entity_table: trips
  segment_table: segments
  trajectory_key: trip_id
  segment_key: trip_id,segment_idx
  predicate_scope: segment_query
  srid: 26916
  trajectory_static_columns:
    - agents:age
    - agents:educationLevel
    - agents:interest
    - agents:joviality
    - agents:family_size
    - trips:num_of_segments
    - trips:start_time
    - trips:end_time
    - trips:trip_geom
  segment_varying_columns:
    - segments:segment_idx
    - segments:t_s
    - segments:t_e
    - segments:s_x
    - segments:s_y
    - segments:e_x
    - segments:e_y
    - segments:seg_min_x
    - segments:seg_max_x
    - segments:seg_min_y
    - segments:seg_max_y

training:
  init_checkpoint: /work_beegfs/sunip956/master_thesis_trajectories/Master_thesis_cardest_data_shift_model/model/runs/pol_shift_random80_stale/checkpoint_best.pt
  seed: 0
  device: auto
  batch_size: 2048
  learning_rate: 0.00001
  optimizer: adam
  epochs: 1
  steps_per_epoch: 2000
  early_stopping_patience_steps: 0
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  checkpoint_interval_steps: 500
  validation_interval_steps: 250
  head_loss_reduction: sum
  mixed_precision: false
  # worker processes preparing the steps' CPU part ahead (results identical; memory-bound count)
  prefetch_workers: 2

inference:
  progressive_sampling: false
  factorized_decoder: anpm
  use_log_space_product: true

validation:
  enabled: true
  prepared_directory: null
  interval_steps: 250
  fresh_sampler_batches: 4
  batch_size: 2048
  selection_metric: validation_traj_weighted_mse
  minimize: true

logging:
  output_directory: model/runs/pol_shift_random80_finetune
  progress_interval_steps: 25

# Interpreter and device (model.src.runtime_interpreter): the learned-gpu environment
# (PyTorch 2.5.1 + CUDA 12.1) that trained the evaluated models; no CPU fallback.
runtime:
  python: /work_beegfs/sunip956/master_thesis_trajectories/joblight_evaluation/envs/learned-gpu/bin/python
  require_cuda: true
