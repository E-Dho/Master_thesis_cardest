# P6: CASE+ (Fanaeepour et al., GeoInformatica 2015; no public code,
# re-implemented from Algorithms 1-3) on POL v3, spatial only. See
# traj_eval/adapters/case_plus.py. unit_size_m is tuned on the validation
# workload (slurm/submit_p6.sh STAGE=tune) before the test runs.
# Re-selected 2026-11-13 after the sparse CASE+ storage (83f78e4; identical
# estimates, other sizes): sweeps traj_phase1_pol_v3_tuning_sparse{,_buckets_ext},
# select_tuned.py rule (min validation geometric-mean smoothed Q-error), 1x budget
# = the own model's inference-only size, 872,606,460 bytes (pol_50m_..._
# segments_first_20k step 20000: 57.1 MB weights/buffers + 815.2 MB value domains).
# Pick: 25 m (validation gm 1.12, p90 1.28, p99 3.74, 0.2 MB sparse; was 1.1 MB
# dense); budget = best.
extends: _base.yaml
experiment:
  experiment_id: traj_phase1_pol_v3
  method_id: case_plus
  variant_id: base
  display_name: CASE+ (spatial only)
  protocol: adapted
  adaptation: Re-implementation of CASE+ from the paper (no public code) on the trip segments - exact grid traversal, Stage 2 read as two visited cells of a row/column not joined by a straight run of visited cells with crossed edges, MBR planarization with virtual counts, Algorithm 2 on the cells the query rectangle intersects, CASE+ minimum-virtual-object correction; spatial only, so queries with a time predicate, attribute predicates and single-table queries are unsupported.
  seeds: [0]
adapter:
  type: traj_case_plus
  benchmark_config: ../../../../query_generation/benchmark_v3/pol_v3_config.json
  plus: true
  temporal: false
  unit_size_m: 25
  budget_bytes: 872606460
